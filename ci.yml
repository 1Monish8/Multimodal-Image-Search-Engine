name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch
      - name: Compile source and run focused tests
        run: |
          python -m py_compile app.py build_index.py evaluate.py prepare_dataset.py src/*.py tests/*.py
          python -m pytest tests/test_query_agent.py -q